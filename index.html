<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squad Tournament Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0a0f" />
<link rel="icon" href="icon.jpeg" type="image/jpeg" />
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #131622;
      --card-2: #1a1f30;
      --border: #262d45;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #00ff88;
      --accent-dim: rgba(0, 255, 136, 0.14);
      --danger: #ff4d6d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 14px 50px;
      line-height: 1.4;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--accent);
      text-transform: uppercase;
    }

    header p {
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 180px;
      background: var(--card-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }
    button:hover { opacity: 0.9; }

    .btn-primary {
      background: var(--accent);
      color: #05130c;
    }

    .btn-secondary {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: rgba(255, 77, 109, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 77, 109, 0.35);
    }

    .player-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .player-chip {
      background: var(--card-2);
      border: 1px solid var(--border);
      padding: 6px 10px 6px 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .player-chip button {
      background: transparent;
      color: var(--danger);
      padding: 0 4px;
      font-size: 1rem;
      line-height: 1;
    }

    .actions-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 12px;
      font-size: 0.95rem;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #05130c;
      border-color: var(--accent);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .empty-msg {
      color: var(--muted);
      text-align: center;
      padding: 24px 10px;
      font-size: 0.95rem;
    }

    .fixture-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-card {
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .match-card.completed {
      border-color: var(--accent);
      background: linear-gradient(90deg, var(--accent-dim), var(--card-2) 55%);
    }

    .match-teams {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 230px;
    }

    .team-name {
      flex: 1;
      font-weight: 700;
      font-size: 0.95rem;
      word-break: break-word;
    }

    .team-name.home { text-align: right; }
    .team-name.away { text-align: left; }

    .score-box {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .score-input {
      width: 50px;
      height: 40px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 800;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }

    .score-input:focus { border-color: var(--accent); }

    .status-btn {
      padding: 7px 11px;
      font-size: 0.78rem;
      border-radius: 8px;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .status-btn.done {
      background: var(--accent);
      color: #05130c;
      border-color: var(--accent);
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    th, td {
      padding: 11px 8px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    th.left, td.left { text-align: left; }

    tbody tr:first-child td:first-child {
      color: var(--accent);
      font-weight: 800;
    }

    .pts-cell {
      font-weight: 800;
      color: var(--accent);
      font-size: 1rem;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent);
      color: #05130c;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
.dev-watermark {
   text-align: center;
   margin-top: 28px;
   padding-top: 16px;
   border-top: 1px solid var(--border);
   color: var(--muted);
   font-size: 0.8rem;
   letter-spacing: 0.8px;
   opacity: 0.85;
 }

 .dev-watermark span {
   color: var(--accent);
   font-weight: 700;
 }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Squad Tournament Tracker</h1>
      <p>Round-Robin League Table</p>
    </header>

    <!-- Players Card -->
    <section class="card">
      <div class="card-title">
        <span>Players (<span id="playerCount">0</span>)</span>
      </div>
      <div class="input-row">
        <input type="text" id="playerInput" placeholder="Enter player name..." maxlength="30" />
        <button class="btn-primary" id="addPlayerBtn">Add</button>
      </div>
      <div class="player-list" id="playerList"></div>
      <div class="actions-bar">
        <button class="btn-primary" id="generateBtn">Generate Round-Robin Fixtures</button>
        <button class="btn-danger" id="resetBtn">Reset Tournament</button>
      </div>
    </section>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="fixtures">Fixtures</button>
      <button class="tab-btn" data-tab="standings">Standings</button>
    </div>

    <!-- Fixtures Tab -->
    <section class="card tab-panel active" id="tab-fixtures">
      <div class="card-title">
        <span>Match Fixtures</span>
        <span style="font-size:0.8rem;color:var(--muted)" id="matchProgress">0 / 0 Played</span>
      </div>
      <div id="fixtureList" class="fixture-list"></div>
    </section>

    <!-- Standings Tab -->
    <section class="card tab-panel" id="tab-standings">
      <div class="card-title">
        <span>Live Standings</span>
        <button class="btn-secondary" id="copyBtn" style="padding:7px 12px;font-size:0.8rem;">Copy for WhatsApp</button>
      </div>
      <div class="table-wrap" id="standingsContainer"></div>
    </section>
  </div>
<footer class="dev-watermark">
  Developed by <span>Marshal John</span>
</footer>
  <div class="toast" id="toast">Copied!</div>

  <script>
    const STORAGE_KEY = "squad-tournament-v2";

    let state = {
      players: [],
      matches: []
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed.players) && Array.isArray(parsed.matches)) {
            state = parsed;
          }
        }
      } catch (e) {
        console.error("Failed to load saved data", e);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function parseScore(val) {
      if (val === "" || val === null || val === undefined) return null;
      const num = parseInt(val, 10);
      return (!isNaN(num) && num >= 0) ? num : null;
    }

    function addPlayer() {
      const input = document.getElementById("playerInput");
      const name = input.value.trim();
      if (!name) return;
      if (state.players.some(p => p.toLowerCase() === name.toLowerCase())) {
        showToast("Player already added!");
        return;
      }
      state.players.push(name);
      input.value = "";
      input.focus();
      saveState();
      renderAll();
    }

    function removePlayer(name) {
      state.players = state.players.filter(p => p !== name);
      state.matches = state.matches.filter(m => m.home !== name && m.away !== name);
      saveState();
      renderAll();
    }

    function generateFixtures() {
      if (state.players.length < 2) {
        showToast("Add at least 2 players first!");
        return;
      }
      if (state.matches.length > 0 && !confirm("Regenerate all fixtures? Current scores will be cleared.")) {
        return;
      }
      const matches = [];
      let id = 1;
      for (let i = 0; i < state.players.length; i++) {
        for (let j = i + 1; j < state.players.length; j++) {
          matches.push({
            id: id++,
            home: state.players[i],
            away: state.players[j],
            homeScore: null,
            awayScore: null,
            completed: false
          });
        }
      }
      state.matches = matches;
      saveState();
      renderAll();
      showToast(`Generated ${matches.length} matches!`);
    }

    function updateScore(matchId, side, rawValue) {
      const match = state.matches.find(m => m.id === matchId);
      if (!match) return;

      const parsed = parseScore(rawValue);
      if (side === "home") match.homeScore = parsed;
      else match.awayScore = parsed;

      // Auto-complete as soon as both scores are valid numbers (including 0!)
      match.completed = (match.homeScore !== null && match.awayScore !== null);

      saveState();
      updateMatchCardUI(match);
      renderStandings();
      updateProgress();
    }

    function toggleComplete(matchId) {
      const match = state.matches.find(m => m.id === matchId);
      if (!match) return;

      if (!match.completed) {
        // Default blank scores to 0 if user clicks Complete
        if (match.homeScore === null) match.homeScore = 0;
        if (match.awayScore === null) match.awayScore = 0;
        match.completed = true;
      } else {
        match.completed = false;
      }

      saveState();
      renderFixtures();
      renderStandings();
    }

    function updateMatchCardUI(match) {
      const card = document.querySelector(`[data-match-id="${match.id}"]`);
      if (!card) return;
      card.classList.toggle("completed", match.completed);
      const btn = card.querySelector(".status-btn");
      if (btn) {
        btn.classList.toggle("done", match.completed);
        btn.textContent = match.completed ? "✓ Done" : "Mark Done";
      }
    }

    function updateProgress() {
      const done = state.matches.filter(m => m.completed).length;
      document.getElementById("matchProgress").textContent = `${done} / ${state.matches.length} Played`;
    }

    function computeStandings() {
      const table = {};
      state.players.forEach(p => {
        table[p] = { name: p, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
      });

      state.matches.forEach(m => {
        if (!m.completed || m.homeScore === null || m.awayScore === null) return;
        const h = table[m.home];
        const a = table[m.away];
        if (!h || !a) return;

        h.p++; a.p++;
        h.gf += m.homeScore; h.ga += m.awayScore;
        a.gf += m.awayScore; a.ga += m.homeScore;

        if (m.homeScore > m.awayScore) {
          h.w++; h.pts += 3; a.l++;
        } else if (m.homeScore < m.awayScore) {
          a.w++; a.pts += 3; h.l++;
        } else {
          h.d++; a.d++; h.pts += 1; a.pts += 1;
        }
      });

      return Object.values(table)
        .map(row => ({ ...row, gd: row.gf - row.ga }))
        .sort((a, b) => {
          if (b.pts !== a.pts) return b.pts - a.pts;
          if (b.gd !== a.gd) return b.gd - a.gd;
          if (b.gf !== a.gf) return b.gf - a.gf;
          return a.name.localeCompare(b.name);
        });
    }

    function renderPlayers() {
      document.getElementById("playerCount").textContent = state.players.length;
      const list = document.getElementById("playerList");
      if (state.players.length === 0) {
        list.innerHTML = `<span style="color:var(--muted);font-size:0.85rem;">No players added yet.</span>`;
        return;
      }
      list.innerHTML = state.players.map(name => `
        <span class="player-chip">
          ${escapeHtml(name)}
          <button title="Remove" onclick="removePlayer('${name.replace(/'/g, "\\'")}')">&times;</button>
        </span>
      `).join("");
    }

    function renderFixtures() {
      const container = document.getElementById("fixtureList");
      updateProgress();

      if (state.matches.length === 0) {
        container.innerHTML = `<div class="empty-msg">No fixtures yet. Add at least 2 players and click <strong>Generate Round-Robin Fixtures</strong>.</div>`;
        return;
      }

      container.innerHTML = state.matches.map(m => `
        <div class="match-card ${m.completed ? "completed" : ""}" data-match-id="${m.id}">
          <div class="match-teams">
            <span class="team-name home">${escapeHtml(m.home)}</span>
            <div class="score-box">
              <input
                type="number"
                inputmode="numeric"
                min="0"
                class="score-input"
                value="${m.homeScore !== null ? m.homeScore : ""}"
                placeholder="-"
                oninput="updateScore(${m.id}, 'home', this.value)"
              />
              <span style="color:var(--muted);font-weight:700;">-</span>
              <input
                type="number"
                inputmode="numeric"
                min="0"
                class="score-input"
                value="${m.awayScore !== null ? m.awayScore : ""}"
                placeholder="-"
                oninput="updateScore(${m.id}, 'away', this.value)"
              />
            </div>
            <span class="team-name away">${escapeHtml(m.away)}</span>
          </div>
          <button class="status-btn ${m.completed ? "done" : ""}" onclick="toggleComplete(${m.id})">
            ${m.completed ? "✓ Done" : "Mark Done"}
          </button>
        </div>
      `).join("");
    }

    function renderStandings() {
      const container = document.getElementById("standingsContainer");
      const rows = computeStandings();

      if (rows.length === 0) {
        container.innerHTML = `<div class="empty-msg">Add players to see the standings table.</div>`;
        return;
      }

      container.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th class="left">Player</th>
              <th>P</th>
              <th>W</th>
              <th>D</th>
              <th>L</th>
              <th>GD</th>
              <th>Pts</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r, i) => `
              <tr>
                <td>${i + 1}</td>
                <td class="left"><strong>${escapeHtml(r.name)}</strong></td>
                <td>${r.p}</td>
                <td>${r.w}</td>
                <td>${r.d}</td>
                <td>${r.l}</td>
                <td>${r.gd > 0 ? "+" + r.gd : r.gd}</td>
                <td class="pts-cell">${r.pts}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function copyForWhatsApp() {
      const rows = computeStandings();
      if (rows.length === 0) {
        showToast("Nothing to copy yet!");
        return;
      }

      const lines = ["*🏆 SQUAD TOURNAMENT STANDINGS*", "```"];
      lines.push("#  Player       P  W  D  L  GD Pts");
      lines.push("----------------------------------");
      rows.forEach((r, i) => {
        const rank = String(i + 1).padEnd(2);
        const name = r.name.slice(0, 11).padEnd(12);
        const p = String(r.p).padStart(2);
        const w = String(r.w).padStart(2);
        const d = String(r.d).padStart(2);
        const l = String(r.l).padStart(2);
        const gd = (r.gd > 0 ? "+" + r.gd : String(r.gd)).padStart(3);
        const pts = String(r.pts).padStart(3);
        lines.push(`${rank} ${name}${p} ${w} ${d} ${l} ${gd} ${pts}`);
      });
      lines.push("```");
      const text = lines.join("\n");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("Table copied for WhatsApp!"));
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Table copied for WhatsApp!");
      }
    }

    function resetTournament() {
      if (!confirm("Reset all players, fixtures, and scores?")) return;
      state = { players: [], matches: [] };
      saveState();
      renderAll();
      showToast("Tournament reset!");
    }

    function renderAll() {
      renderPlayers();
      renderFixtures();
      renderStandings();
    }

    // Event Listeners
    document.getElementById("addPlayerBtn").addEventListener("click", addPlayer);
    document.getElementById("playerInput").addEventListener("keydown", e => {
      if (e.key === "Enter") addPlayer();
    });
    document.getElementById("generateBtn").addEventListener("click", generateFixtures);
    document.getElementById("resetBtn").addEventListener("click", resetTournament);
    document.getElementById("copyBtn").addEventListener("click", copyForWhatsApp);

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
        if (btn.dataset.tab === "standings") renderStandings();
      });
    });

    loadState();
    renderAll();
  </script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
  }
</script>
</body>
</html>
